<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대학 경쟁률 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main>
    <!-- 검색 화면 -->
    <section id="searchScreen" class="screen" aria-labelledby="searchScreenTitle">
      <header class="app-header">
        <h1 id="searchScreenTitle">실시간 경쟁률</h1>
        <p class="subtitle">대학과 학과를 검색해 실시간 및 지난 경쟁률을 확인하세요</p>
      </header>

      <div class="card">
        <form id="universityForm" class="search-box">
          <input id="universityQuery" type="search" placeholder="대학명 검색 (예: 한양, 가톨릭, 강원)" autocomplete="off" />
          <button type="submit" id="universitySearchButton">검색</button>
        </form>
        <ul id="universityResults" class="list" role="listbox" hidden></ul>
        <p id="status" class="status" role="status" aria-live="polite">대학명을 검색하세요.</p>

        <div class="divider"></div>

        <div class="dept-section">
          <div class="dept-target">
            <span class="label">선택 대학</span>
            <span id="currentUniversity" class="muted">대학을 먼저 검색하여 선택하세요.</span>
          </div>
          <div class="search-box">
            <input id="departmentQuery" type="search" aria-label="학과·모집단위 검색" placeholder="학과·모집단위 검색 (모든 전형)" autocomplete="off" disabled />
          </div>
          <ul id="departmentResults" class="list" role="listbox" hidden></ul>
          <div class="selection-bar">
            <p id="selectionInfo" class="selection-text"></p>
            <button id="addButton" type="button" class="btn-primary" disabled>관심 목록에 추가</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 관심 목록 화면 -->
    <section id="watchScreen" class="screen" hidden aria-labelledby="watchScreenTitle">
      <header class="app-header">
        <div class="spread">
          <h1 id="watchScreenTitle">관심 목록 <span id="watchCount" class="count-chip">0</span></h1>
          <div class="watch-actions">
            <button id="refreshButton" type="button" class="btn-sm" disabled>새로고침</button>
            <button id="clearButton" type="button" class="btn-sm btn-ghost" disabled>비우기</button>
          </div>
        </div>
        <p id="refreshStatus" class="status" role="status" aria-live="polite"></p>
      </header>

      <div class="card table-card">
        <div class="table-wrap">
          <table id="watchTable">
            <thead>
              <tr>
                <th>대학</th>
                <th>전형</th>
                <th>모집단위</th>
                <th class="num">모집</th>
                <th class="num">지원</th>
                <th class="num">경쟁률</th>
                <th>갱신시각</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="watchBody"></tbody>
          </table>
        </div>
        <p id="watchEmpty" class="empty-state">아직 관심 목록에 추가한 학과가 없습니다.<br><span>검색 탭에서 원하는 학과를 추가해보세요.</span></p>
      </div>
    </section>
  </main>

  <!-- 하단 탭 네비게이션 -->
  <nav class="bottom-nav" aria-label="주요 화면">
    <div class="bottom-nav-inner">
      <button type="button" class="nav-item active" data-nav-target="search" aria-controls="searchScreen" aria-current="page">
        <span class="nav-icon" aria-hidden="true">⌕</span>
        <span>검색</span>
      </button>
      <button type="button" class="nav-item" data-nav-target="watch" aria-controls="watchScreen">
        <span class="nav-icon" aria-hidden="true">♡</span>
        <span>관심 목록 <span id="navWatchCount" class="nav-count">0</span></span>
      </button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
